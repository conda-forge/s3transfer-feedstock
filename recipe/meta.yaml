{% set version = "0.19.3" %}

package:
  name: s3transfer
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/s3transfer/s3transfer-{{ version }}.tar.gz
  sha256: 8326acc3d056d7f7b8a37110c7d2aea41f67e83f6ae79cd3b5fbcca34c726406

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv


requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - botocore >=1.37.4,<2.0a.0

test:
  requires:
    - python {{ python_min }}
  imports:
    - s3transfer

about:
  home: https://github.com/boto/s3transfer
  license_file: LICENSE.txt
  license: Apache-2.0
  license_family: Apache
  summary: An Amazon S3 Transfer Manager
  dev_url: https://github.com/boto/s3transfer

extra:
  recipe-maintainers:
    - tkelman
    - ocefpaf
