schema_version: 1

context:
  version: "0.19.3"

package:
  name: s3transfer
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/s3transfer/s3transfer-${{ version }}.tar.gz
  sha256: 8326acc3d056d7f7b8a37110c7d2aea41f67e83f6ae79cd3b5fbcca34c726406

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
  run:
    - python >=${{ python_min }}
    - botocore >=1.37.4,<2.0a.0

tests:
  - python:
      imports:
        - s3transfer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: An Amazon S3 Transfer Manager
  license: Apache-2.0
  license_file:
    - NOTICE.txt
    - LICENSE.txt
  homepage: https://github.com/boto/s3transfer

extra:
  recipe-maintainers:
    - tkelman
    - ocefpaf
